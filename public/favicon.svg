<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Xtenzium CRM favicon.

       Same V4 mark as the marketing site, deliberately set on the CRM's
       carbon ground rather than left bare. The two sit in adjacent tabs
       all day; identical favicons make them indistinguishable at 16px,
       and a dark chip says "the tool" while the geometry still says
       "Xtenzium".

       Colours are literal, not tokens: a favicon is fetched standalone
       and never sees the app stylesheet. -->
  <rect width="40" height="40" rx="9" fill="#100D0B"/>
  <g transform="translate(20 20) scale(0.68) translate(-20 -20)">
    <g fill="#F2895C">
      <path d="M6,24 L19.5,15 L19.5,27 L6,36 Z"/>
      <path d="M6,24 L19.5,15 L19.5,27 L6,36 Z" transform="rotate(180 20 20)"/>
    </g>
    <g fill="#C05A21">
      <path d="M6,4 L19.5,13 L19.5,25 L6,16 Z"/>
      <path d="M6,4 L19.5,13 L19.5,25 L6,16 Z" transform="rotate(180 20 20)"/>
    </g>
  </g>
</svg>
