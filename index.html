<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This document is the CRM and admin shell, and nothing else. The
      public site is the Astro app served from / — it has its own head,
      its own SEO and its own favicon. Everything here is scoped to an
      internal tool.
    -->
    <title>Xtenzium CRM</title>
    <meta name="description" content="Internal CRM for Xtenzium — pipeline, projects, tasks and time." />

    <!--
      Deliberately noindex. This shell previously carried the marketing
      site's `index, follow` plus a canonical pointing at the homepage,
      which invited Google to index the CRM and to treat it as a
      duplicate of xtenzium.com. It is behind a login and has no
      business in a search result.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#F2895C" />

    <!--
      Matches the CRM's carbon ground, so mobile browser chrome and the
      PWA-ish shell don't frame a dark app in white.
    -->
    <meta name="theme-color" content="#100D0B" />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
